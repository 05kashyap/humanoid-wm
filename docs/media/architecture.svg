<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 280" width="940" height="280" role="img" aria-label="World model: three frames pass through a frozen DINOv2 encoder and a trainable projector; each frame's patches are joined with an embedding of the pusher's position and velocity; a causal ViT, conditioned on the actions, predicts the next latent of each frame, matched against the same encoder's latents of the following frames with a stop-gradient." font-family="Helvetica, Arial, sans-serif">
